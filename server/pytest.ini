[pytest]
testpaths = tests
# Tests that need a live Ollama server with the model registered. They are not
# unit tests: they are how you check the GGUF path before a demo.
#   run everything except them (the default):  pytest
#   run only them:                             pytest -m integration
markers =
    integration: needs a running Ollama server with the relearn-diagnosis model
addopts = -m "not integration"
filterwarnings =
    ignore::DeprecationWarning:httpx.*
